name: slate

# Dev: PostgreSQL only; run the app with pnpm dev after approval to use Docker in this workspace.
# Demo: app profile is scaffold configuration and must be reviewed against the confirmed specification.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: slate
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./.cache/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slate -d slate"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://slate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/slate
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      UPLOAD_DIR: /app/uploads
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - ./.cache/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
