name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
          POSTGRES_DB: slate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U slate -d slate_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://slate:slate@127.0.0.1:5432/slate_test
      SLATE_MIGRATION_DATABASE: slate_test
      SLATE_TEST_DATABASE: "1"
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
      UPLOAD_DIR: .cache/uploads
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint + format (Biome)
        run: pnpm exec biome ci
      - run: pnpm typecheck
      - name: Migrate (Postgres 16)
        run: pnpm db:migrate
      - name: Seed disposable demo fixtures twice
        env:
          SLATE_DEMO_SEED: "1"
        run: |
          SLATE_DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SLATE_DEMO_PASSWORD"
          echo "SLATE_DEMO_PASSWORD=$SLATE_DEMO_PASSWORD" >> "$GITHUB_ENV"
          export SLATE_DEMO_PASSWORD
          pnpm db:seed
          mkdir -p .cache
          pnpm exec tsx tests/api/stock-seed-snapshot.ts > .cache/m3-seed-first.json
          pnpm db:seed
          pnpm exec tsx tests/api/stock-seed-snapshot.ts > .cache/m3-seed-second.json
          diff -u .cache/m3-seed-first.json .cache/m3-seed-second.json
      - name: Tests (Vitest)
        run: pnpm test
      - name: Production build
        env:
          NEXT_PUBLIC_USE_MOCKS: "0"
        run: pnpm build
      - name: Live browser smoke
        env:
          NEXT_PUBLIC_USE_MOCKS: "0"
          PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e --workers=1
  live-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Start a fresh local demo in live mode
        env:
          CI: "false"
          SLATE_COMPOSE_PROJECT: slate-launcher-ci
        run: |
          mkdir -p .cache
          bash -n start.sh
          ./start.sh --live > .cache/launcher.log 2>&1 &
          launcher=$!
          trap 'kill "$launcher" 2>/dev/null || true' EXIT
          for attempt in {1..180}; do
            if curl -fsS http://127.0.0.1:3000/api/v1/health 2>/dev/null |
                jq -e '.ok == true and .db == "up"' >/dev/null; then
              exit 0
            fi
            kill -0 "$launcher" 2>/dev/null || break
            sleep 1
          done
          cat .cache/launcher.log
          exit 1
